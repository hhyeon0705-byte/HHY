<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습 2: 댓글 추천 시스템</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            padding: 30px;
        }
        ul {
            list-style-type: none; 
            padding: 0;
        }
        li {
            background-color: #f1f1f1;
            margin: 8px 0;
            padding: 12px;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }
        .comment-text {
            font-size: 16px;
            flex-grow: 1;
            word-break: break-all;
        }
        .btn-group {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }
        .btn-group button {
            padding: 4px 8px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 3px;
            border: 1px solid #ccc;
            background-color: #fff;
        }
        .btn-like:hover { background-color: #e3f2fd; color: #2196f3; }
        .btn-dislike:hover { background-color: #ffebee; color: #f44336; }
        .btn-del:hover { background-color: #eeeeee; color: #333; }
        
        .btn-main {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
    <script>
        function addComment() {
            var inputStr = prompt("추가할 댓글 내용을 입력하세요:", "오늘 수업 너무 재밌어요!");

            if (inputStr == null || inputStr.trim() == "") {
                return; 
            }

            var parent = document.getElementById("commentList");
            var newLi = document.createElement("li");

            var textSpan = document.createElement("span");
            textSpan.className = "comment-text";
            textSpan.innerHTML = inputStr;

            var btnGroup = document.createElement("div");
            btnGroup.className = "btn-group";

            var btnLike = document.createElement("button");
            btnLike.className = "btn-like";
            btnLike.innerHTML = "👍 0";
            btnLike.onclick = function() {
                var count = parseInt(this.innerHTML.replace("👍 ", ""));
                this.innerHTML = "👍 " + (count + 1);
            };

            var btnDislike = document.createElement("button");
            btnDislike.className = "btn-dislike";
            btnDislike.innerHTML = "👎 0";
            btnDislike.onclick = function() {
                var count = parseInt(this.innerHTML.replace("👎 ", ""));
                this.innerHTML = "👎 " + (count + 1);
            };

            var btnDelete = document.createElement("button");
            btnDelete.className = "btn-del";
            btnDelete.innerHTML = "❌ 삭제";
            btnDelete.onclick = function() {
                parent.removeChild(newLi);
            };

            btnGroup.appendChild(btnLike);
            btnGroup.appendChild(btnDislike);
            btnGroup.appendChild(btnDelete);

            newLi.appendChild(textSpan);
            newLi.appendChild(btnGroup);

            parent.appendChild(newLi);
        }
    </script>
</head>
<body onload="addComment()"> 

    <h3>실습 2: 댓글 추가/삭제 및 추천 프로그램</h3>
    <p>댓글을 추가하고 좋아요, 싫어요 기능과 삭제 기능을 개별적으로 조작해 보세요.</p>
    <hr>

    <button onclick="addComment()" class="btn-main">+ 댓글 추가하기</button>

    <ul id="commentList">
    </ul>

</body>
</html>
