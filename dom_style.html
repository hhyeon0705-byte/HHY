<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습 1: DOM 스타일 변환기</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            text-align: center;
            padding: 50px;
        }
        #input-box {
            margin-bottom: 20px;
        }
        #text-input {
            padding: 10px;
            font-size: 16px;
            width: 50%;
            max-width: 400px;
            border: 1px solid #999;
            border-radius: 5px;
        }
        #target {
            font-size: 20px;
            font-weight: bold;
            padding: 20px;
            border: 2px solid #ccc;
            margin: 20px auto;
            width: 80%;
            transition: all 0.3s; 
            white-space: pre-wrap;
            word-break: break-all;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            background-color: #eee;
            border: 1px solid #999;
            border-radius: 5px;
        }
        button:hover {
            background-color: #ddd;
        }
        .btn-reset {
            background-color: #f44336;
            color: white;
            border: 1px solid #d32f2f;
        }
        .btn-reset:hover {
            background-color: #da190b;
        }
    </style>
    <script>
        function updateText() {
            var inputVal = document.getElementById("text-input").value;
            var obj = document.getElementById("target");
            
            if (inputVal.trim() === "") {
                obj.innerText = "이 문장의 스타일을 바꿔보세요!";
            } else {
                obj.innerText = inputVal;
            }
        }

        function changeColor() {
            var obj = document.getElementById("target");
            obj.style.color = "red";
        }

        function changeSize() {
            var obj = document.getElementById("target");
            obj.style.fontSize = "32px";
        }

        function changeBackground() {
            var obj = document.getElementById("target");
            obj.style.backgroundColor = "yellow";
        }

        function toggleVisibility() {
            var obj = document.getElementById("target");
            if (obj.style.display === "none") {
                obj.style.display = "block";
            } else {
                obj.style.display = "none";
            }
        }

        function resetStyle() {
            var obj = document.getElementById("target");
            var inputObj = document.getElementById("text-input");
            
            inputObj.value = "";
            obj.innerText = "이 문장의 스타일을 바꿔보세요!";
            
            obj.style.color = "";
            obj.style.fontSize = "";
            obj.style.backgroundColor = "";
            obj.style.display = "block"; 
        }
    </script>
</head>
<body>

    <h3>실습 1: DOM 스타일 제어하기</h3>
    <hr>

    <div id="input-box">
        <input type="text" id="text-input" oninput="updateText()" placeholder="원하는 문장을 입력하세요">
    </div>

    <p id="target">이 문장의 스타일을 바꿔보세요!</p>

    <br>

    <button onclick="changeColor()">글자색 변경</button>
    <button onclick="changeSize()">크게 보기</button>
    <button onclick="changeBackground()">배경 강조</button>
    <button onclick="toggleVisibility()">숨기기/보이기</button>
    <button onclick="resetStyle()" class="btn-reset">원상복구</button>

</body>
</html>
