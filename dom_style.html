<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DOM 스타일 변환기 - 인터넷활용 실습</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    .dom-section {
      text-align: center;
    }
    #input-box {
      margin-bottom: 20px;
    }
    #text-input {
      padding: 10px;
      font-size: 16px;
      width: 70%;
      max-width: 400px;
      border: 2px solid #b3e5fc;
      border-radius: 8px;
    }
    #target {
      font-size: 20px;
      font-weight: bold;
      padding: 30px;
      border: 2px dashed #00a8e8;
      border-radius: 12px;
      margin: 20px auto;
      width: 90%;
      transition: all 0.3s; 
      white-space: pre-wrap;
      word-break: break-all;
      background-color: #fafdfc;
    }
    .dom-controls button {
      margin: 5px;
    }
    .btn-reset {
      background-color: #ff5252;
    }
    .btn-reset:hover {
      background-color: #d32f2f;
    }
  </style>
  
  <script>
    function updateText() {
        var inputVal = document.getElementById("text-input").value;
        var obj = document.getElementById("target");
        
        if (inputVal.trim() === "") {
            obj.innerText = "이 문장의 스타일을 바꿔보세요!";
        } else {
            obj.innerText = inputVal;
        }
    }

    function changeColor() {
        var obj = document.getElementById("target");
        obj.style.color = "#ff4081"; // 쨍한 하늘색 테마에 어울리는 핑크로 변경
    }

    function changeSize() {
        var obj = document.getElementById("target");
        obj.style.fontSize = "32px";
    }

    function changeBackground() {
        var obj = document.getElementById("target");
        obj.style.backgroundColor = "#fff9c4"; // 부드러운 노란색으로 변경
    }

    function toggleVisibility() {
        var obj = document.getElementById("target");
        if (obj.style.display === "none") {
            obj.style.display = "block";
        } else {
            obj.style.display = "none";
        }
    }

    function resetStyle() {
        var obj = document.getElementById("target");
        var inputObj = document.getElementById("text-input");
        
        inputObj.value = "";
        obj.innerText = "이 문장의 스타일을 바꿔보세요!";
        
        obj.style.color = "";
        obj.style.fontSize = "";
        obj.style.backgroundColor = "";
        obj.style.display = "block"; 
    }
  </script>
</head>
<body>

<header>
  <h1>이름: 현혜연</h1>
  <p class="subtitle">한 줄 소개: 광운대학교 26학번</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="portfolio.html">Portfolio</a>
  <a href="contact.html">Contact</a>
</nav>

<main class="container dom-section">
  <section>
    <h2>실습 1: DOM 스타일 제어하기</h2>
    <hr style="border:0; height:1px; background:#cfe2fe; margin-bottom:20px;">

    <div id="input-box">
        <input type="text" id="text-input" oninput="updateText()" placeholder="원하는 문장을 입력하세요">
    </div>

    <p id="target">이 문장의 스타일을 바꿔보세요!</p>

    <br>

    <div class="dom-controls">
        <button onclick="changeColor()">글자색 변경</button>
        <button onclick="changeSize()">크게 보기</button>
        <button onclick="changeBackground()">배경 강조</button>
        <button onclick="toggleVisibility()">숨기기/보이기</button>
        <button onclick="resetStyle()" class="btn-reset">원상복구</button>
    </div>
  </section>
</main>

<footer>
  <small>&copy; <span id="year"></span> 이름: 현혜연</small>
</footer>

<script src="script.js"></script>
</body>
</html>
